version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --no-audit --no-fund
    build:
      commands:
        - npm run lint
        - npm test
  artifacts:
    baseDirectory: /
    files:
      - '**/*.html'
      - api/**/*
    exclude:
      - node_modules/**/*
      - test/**/*
      - '*.config.js'
      - package*.json
      - .mcp.json
      - amplify.yml
  cache:
    paths:
      - node_modules/**/*
customHeaders:
  - pattern: '**/*'
    headers:
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: X-XSS-Protection
        value: '1; mode=block'
