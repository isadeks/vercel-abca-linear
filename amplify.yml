version: 1
frontend:
  phases:
    preBuild:
      commands:
        - node --version
        - npm ci --no-audit --no-fund
    build:
      commands:
        - npm run lint
        - npm test
  artifacts:
    baseDirectory: .
    files:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '!node_modules/**'
      - '!api/**'
      - '!test/**'
      - '!eslint.config.js'
  cache:
    paths:
      - node_modules/**/*
