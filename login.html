<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Wander</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sand:    #f5f0e8;
      --cream:   #faf8f4;
      --stone:   #e8e0d0;
      --ink:     #1a1714;
      --ash:     #6b6560;
      --teal:    #2a7a6f;
      --teal-lt: #d5ecea;
      --coral:   #c9624a;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans:  'Inter', system-ui, sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-sans);
      background: var(--cream);
      color: var(--ink);
      font-size: 16px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { color: inherit; text-decoration: none; }

    /* ── Nav ──────────────────────────────────────────────────── */
    .nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 40px;
      background: var(--cream);
      border-bottom: 1px solid var(--stone);
    }
    .nav__logo {
      font-family: var(--font-serif);
      font-size: 1.6rem;
      font-weight: 400;
      letter-spacing: 0.06em;
      color: var(--ink);
    }
    .nav__back {
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ash);
      transition: color 0.2s;
    }
    .nav__back:hover { color: var(--ink); }

    /* ── Login card ───────────────────────────────────────────── */
    .login-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }

    .login-card {
      background: white;
      border: 1px solid var(--stone);
      border-radius: 8px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
    }

    .login-card__title {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 400;
      color: var(--ink);
      margin-bottom: 8px;
    }

    .login-card__subtitle {
      font-size: 0.875rem;
      color: var(--ash);
      margin-bottom: 32px;
    }

    /* ── Provider buttons ─────────────────────────────────────── */
    .provider-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 13px 20px;
      border: 1px solid var(--stone);
      border-radius: 6px;
      background: white;
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      text-decoration: none;
    }
    .provider-btn:hover {
      border-color: var(--ash);
      background: var(--sand);
    }
    .provider-btn + .provider-btn {
      margin-top: 12px;
    }
    .provider-btn__icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    /* ── Divider ──────────────────────────────────────────────── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: var(--ash);
      font-size: 0.8rem;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--stone);
    }

    /* ── Error banner ─────────────────────────────────────────── */
    .auth-error {
      display: none;
      background: #fdf2f0;
      border: 1px solid #f3c5bc;
      border-radius: 6px;
      padding: 12px 16px;
      font-size: 0.85rem;
      color: var(--coral);
      margin-bottom: 24px;
    }
    .auth-error.visible { display: block; }

    /* ── Fine print ───────────────────────────────────────────── */
    .fine-print {
      font-size: 0.75rem;
      color: var(--ash);
      text-align: center;
      margin-top: 24px;
    }
    .fine-print a { text-decoration: underline; color: var(--ash); }
    .fine-print a:hover { color: var(--ink); }

    /* ── Footer ───────────────────────────────────────────────── */
    .footer {
      text-align: center;
      padding: 24px;
      font-size: 0.8rem;
      color: var(--ash);
      border-top: 1px solid var(--stone);
    }
  </style>
</head>
<body>

  <!-- Nav -->
  <nav class="nav">
    <a class="nav__logo" href="/">Wander</a>
    <a class="nav__back" href="/">&#8592; Back to explore</a>
  </nav>

  <!-- Login card -->
  <div class="login-wrap">
    <div class="login-card">
      <h1 class="login-card__title">Welcome back</h1>
      <p class="login-card__subtitle">Sign in to save your favourite destinations and bookings.</p>

      <!-- Error banner (shown when ?auth_error is present) -->
      <div class="auth-error" id="authError" role="alert"></div>

      <!-- Google -->
      <a class="provider-btn" href="/api/auth/google" id="googleBtn">
        <!-- Google "G" logo (SVG, no external deps) -->
        <svg class="provider-btn__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continue with Google
      </a>

      <div class="divider">or</div>

      <!-- GitHub -->
      <a class="provider-btn" href="/api/auth/github" id="githubBtn">
        <!-- GitHub mark (SVG) -->
        <svg class="provider-btn__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="currentColor">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        Continue with GitHub
      </a>

      <p class="fine-print">
        By continuing, you agree to our
        <a href="/terms.html">Terms of Service</a>
        and
        <a href="/privacy.html">Privacy Policy</a>.
      </p>
    </div>
  </div>

  <footer class="footer">
    &copy; 2024 Wander Travel. All rights reserved.
  </footer>

  <script>
    // Show auth error from query string (set by callback handlers on failure).
    (function () {
      const params = new URLSearchParams(window.location.search);
      const err    = params.get('auth_error');
      const banner = document.getElementById('authError');
      if (err && banner) {
        const messages = {
          missing_params:  'Something went wrong. Please try again.',
          invalid_state:   'Security check failed. Please try again.',
          access_denied:   'Sign-in was cancelled.',
        };
        banner.textContent = messages[err] ?? 'Sign-in failed: ' + err;
        banner.classList.add('visible');
      }
    })();
  </script>
</body>
</html>
