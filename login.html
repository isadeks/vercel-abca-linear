<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Wander</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sand:    #f5f0e8;
      --cream:   #faf8f4;
      --stone:   #e8e0d0;
      --ink:     #1a1714;
      --ash:     #6b6560;
      --teal:    #2a7a6f;
      --teal-lt: #d5ecea;
      --coral:   #c9624a;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans:  'Inter', system-ui, sans-serif;
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-sans);
      background: var(--cream);
      color: var(--ink);
      font-size: 16px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }

    /* ── Nav ── */
    .nav {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 40px;
      background: rgba(250,248,244,0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--stone);
    }
    .nav__logo {
      font-family: var(--font-serif);
      font-size: 1.6rem;
      font-weight: 400;
      letter-spacing: 0.06em;
      color: var(--ink);
    }
    .nav__back {
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--teal);
      transition: opacity 0.2s;
    }
    .nav__back:hover { opacity: 0.7; }

    /* ── Split layout ── */
    .auth-wrap {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: calc(100vh - 65px);
    }
    @media (max-width: 800px) {
      .auth-wrap { grid-template-columns: 1fr; }
      .auth-aside { display: none; }
    }

    .auth-aside {
      background:
        linear-gradient(to bottom, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.5) 100%),
        url('https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?w=1200&q=80') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 60px 48px;
    }
    .auth-aside__quote {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 2.5vw, 2.4rem);
      font-weight: 300;
      font-style: italic;
      color: white;
      line-height: 1.3;
      margin-bottom: 16px;
    }
    .auth-aside__attr {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
    }

    /* ── Form panel ── */
    .auth-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 64px 56px;
      max-width: 500px;
      width: 100%;
      margin: 0 auto;
    }
    @media (max-width: 560px) { .auth-panel { padding: 48px 24px; } }

    .auth-eyebrow {
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--teal);
      margin-bottom: 12px;
    }
    .auth-title {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 3vw, 2.8rem);
      font-weight: 300;
      line-height: 1.1;
      margin-bottom: 8px;
    }
    .auth-sub {
      font-size: 0.9rem;
      color: var(--ash);
      margin-bottom: 36px;
    }
    .auth-sub a {
      color: var(--teal);
      border-bottom: 1px solid currentColor;
      transition: opacity 0.2s;
    }
    .auth-sub a:hover { opacity: 0.7; }

    /* ── Form ── */
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ash);
    }
    .form-group input {
      padding: 13px 16px;
      border: 1px solid var(--stone);
      background: var(--cream);
      font-family: var(--font-sans);
      font-size: 0.92rem;
      color: var(--ink);
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus { border-color: var(--teal); }
    .form-group input::placeholder { color: #b0a898; }
    .form-group input[aria-invalid='true'] { border-color: var(--coral); }

    .field-error {
      font-size: 0.78rem;
      color: var(--coral);
      margin-top: 2px;
      display: none;
    }
    .field-error.visible { display: block; }

    /* ── Error banner ── */
    .auth-error {
      background: #fdf0ee;
      border: 1px solid #f0b8ae;
      color: var(--coral);
      padding: 12px 16px;
      font-size: 0.85rem;
      line-height: 1.6;
      display: none;
    }
    .auth-error.visible { display: block; }

    /* ── Success banner ── */
    .auth-success {
      background: var(--teal-lt);
      border: 1px solid #a0cdc8;
      color: var(--teal);
      padding: 12px 16px;
      font-size: 0.85rem;
      line-height: 1.6;
      display: none;
    }
    .auth-success.visible { display: block; }

    /* ── Submit button ── */
    .btn-submit {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 28px;
      font-family: var(--font-sans);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: var(--teal);
      border: 1px solid var(--teal);
      color: white;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
      margin-top: 6px;
    }
    .btn-submit:hover:not(:disabled) { background: #22665c; border-color: #22665c; }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    /* ── Footer strip ── */
    footer {
      background: var(--ink);
      color: rgba(255,255,255,0.4);
      text-align: center;
      padding: 24px;
      font-size: 0.75rem;
    }
    footer a { color: rgba(255,255,255,0.4); transition: color 0.2s; }
    footer a:hover { color: white; }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="nav__logo">Wander</a>
    <a href="index.html" class="nav__back">← Back to home</a>
  </nav>

  <div class="auth-wrap">
    <!-- Left decorative panel -->
    <div class="auth-aside" aria-hidden="true">
      <p class="auth-aside__quote">"Not all those who wander are lost."</p>
      <p class="auth-aside__attr">J.R.R. Tolkien</p>
    </div>

    <!-- Form panel -->
    <div class="auth-panel">
      <p class="auth-eyebrow">Welcome back</p>
      <h1 class="auth-title">Sign in to<br><em>Wander</em></h1>
      <p class="auth-sub">
        Don't have an account?
        <a href="signup.html">Create one — it's free.</a>
      </p>

      <div class="auth-error" id="errorBanner" role="alert" aria-live="polite"></div>
      <div class="auth-success" id="successBanner" role="status" aria-live="polite"></div>

      <form class="auth-form" id="signinForm" novalidate>
        <div class="form-group">
          <label for="email">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
          />
          <span class="field-error" id="emailError"></span>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            placeholder="••••••••"
            required
          />
          <span class="field-error" id="passwordError"></span>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          Sign in
        </button>
      </form>
    </div>
  </div>

  <footer>
    &copy; 2026 Wander. <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a>
  </footer>

  <script>
    const form        = document.getElementById('signinForm');
    const submitBtn   = document.getElementById('submitBtn');
    const errorBanner   = document.getElementById('errorBanner');
    const successBanner = document.getElementById('successBanner');

    function clearErrors() {
      errorBanner.textContent = '';
      errorBanner.classList.remove('visible');
      successBanner.textContent = '';
      successBanner.classList.remove('visible');
      document.querySelectorAll('.field-error').forEach(el => {
        el.textContent = '';
        el.classList.remove('visible');
      });
      document.querySelectorAll('input').forEach(el => el.removeAttribute('aria-invalid'));
    }

    function showError(msg, fieldId) {
      if (fieldId) {
        const input = document.getElementById(fieldId);
        const errEl = document.getElementById(fieldId + 'Error');
        if (input)  input.setAttribute('aria-invalid', 'true');
        if (errEl)  { errEl.textContent = msg; errEl.classList.add('visible'); }
      } else {
        errorBanner.textContent = msg;
        errorBanner.classList.add('visible');
      }
    }

    function clientValidate() {
      const email    = form.email.value.trim();
      const password = form.password.value;
      let valid = true;

      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showError('Please enter a valid email address.', 'email');
        valid = false;
      }
      if (!password) {
        showError('Password is required.', 'password');
        valid = false;
      }
      return valid;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearErrors();

      if (!clientValidate()) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';

      try {
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({
            action:   'signin',
            email:    form.email.value.trim(),
            password: form.password.value,
          }),
        });

        const data = await res.json();

        if (res.ok && data.ok) {
          successBanner.textContent = 'Signed in! Redirecting…';
          successBanner.classList.add('visible');
          setTimeout(() => { window.location.href = 'index.html'; }, 1200);
          return;
        }

        if (data.errors && data.errors.length) {
          data.errors.forEach(err => showError(err));
        } else {
          showError(data.message || 'Sign-in failed. Please try again.');
        }
      } catch {
        showError('A network error occurred. Please check your connection.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
      }
    });
  </script>

</body>
</html>
