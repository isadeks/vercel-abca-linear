<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — Wander</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sand:    #f5f0e8;
      --cream:   #faf8f4;
      --stone:   #e8e0d0;
      --ink:     #1a1714;
      --ash:     #6b6560;
      --teal:    #2a7a6f;
      --teal-lt: #d5ecea;
      --coral:   #c9624a;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans:  'Inter', system-ui, sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-sans);
      background: var(--cream);
      color: var(--ink);
      font-size: 16px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { color: inherit; text-decoration: none; }

    /* ── Nav ─────────────────────────────────────────────────────── */
    nav {
      background: var(--cream);
      border-bottom: 1px solid var(--stone);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }

    .nav-brand {
      font-family: var(--font-serif);
      font-size: 1.6rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: var(--ink);
    }

    .nav-links { display: flex; gap: 2rem; }

    .nav-links a {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--ash);
      letter-spacing: 0.03em;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: var(--teal); }

    /* ── Main ────────────────────────────────────────────────────── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
    }

    .card {
      background: #fff;
      border: 1px solid var(--stone);
      border-radius: 8px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 400;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 0.875rem;
      color: var(--ash);
      margin-bottom: 2rem;
    }

    label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 500;
      margin-bottom: 0.375rem;
      letter-spacing: 0.02em;
    }

    input[type="email"] {
      width: 100%;
      padding: 0.625rem 0.875rem;
      border: 1px solid var(--stone);
      border-radius: 4px;
      font-family: var(--font-sans);
      font-size: 0.9375rem;
      color: var(--ink);
      background: var(--cream);
      transition: border-color 0.2s, box-shadow 0.2s;
      margin-bottom: 1.25rem;
    }

    input[type="email"]:focus {
      outline: none;
      border-color: var(--teal);
      box-shadow: 0 0 0 3px var(--teal-lt);
    }

    button[type="submit"] {
      width: 100%;
      padding: 0.75rem;
      background: var(--teal);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-family: var(--font-sans);
      font-size: 0.9375rem;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: background 0.2s;
    }

    button[type="submit"]:hover:not(:disabled) { background: #1f5f56; }
    button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }

    .message {
      margin-top: 1.25rem;
      padding: 0.75rem 1rem;
      border-radius: 4px;
      font-size: 0.875rem;
      display: none;
    }

    .message.success {
      background: var(--teal-lt);
      color: var(--teal);
      border: 1px solid #a8d5d0;
      display: block;
    }

    .message.error {
      background: #fce8e3;
      color: var(--coral);
      border: 1px solid #f0c4b8;
      display: block;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: var(--ash);
    }

    .back-link a { color: var(--teal); font-weight: 500; }
    .back-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="nav-brand">Wander</a>
    <div class="nav-links">
      <a href="/destinations.html">Destinations</a>
      <a href="/about.html">About</a>
      <a href="/contact.html">Contact</a>
    </div>
  </nav>

  <main>
    <div class="card">
      <h1>Forgot password?</h1>
      <p class="subtitle">Enter your email and we'll send you a reset link.</p>

      <form id="forgot-form" novalidate>
        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          name="email"
          autocomplete="email"
          placeholder="you@example.com"
          required
        />

        <button type="submit" id="submit-btn">Send reset link</button>
      </form>

      <div class="message" id="message" role="alert" aria-live="polite"></div>

      <p class="back-link">
        Remembered it? <a href="/login.html">Back to login</a>
      </p>
    </div>
  </main>

  <script>
    const form = document.getElementById('forgot-form');
    const submitBtn = document.getElementById('submit-btn');
    const messageEl = document.getElementById('message');

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = 'message ' + type;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();

      if (!email) {
        showMessage('Please enter your email address.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending…';
      messageEl.className = 'message'; // hide previous

      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });

        const data = await res.json();

        if (res.ok) {
          showMessage(data.message, 'success');
          form.reset();
        } else {
          showMessage(data.error || 'Something went wrong. Please try again.', 'error');
        }
      } catch {
        showMessage('Network error. Please check your connection and try again.', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send reset link';
      }
    });
  </script>
</body>
</html>
