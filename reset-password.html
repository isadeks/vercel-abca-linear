<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Wander</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sand:    #f5f0e8;
      --cream:   #faf8f4;
      --stone:   #e8e0d0;
      --ink:     #1a1714;
      --ash:     #6b6560;
      --teal:    #2a7a6f;
      --teal-lt: #d5ecea;
      --coral:   #c9624a;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans:  'Inter', system-ui, sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-sans);
      background: var(--cream);
      color: var(--ink);
      font-size: 16px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { color: inherit; text-decoration: none; }

    /* ── Nav ─────────────────────────────────────────────────────── */
    nav {
      background: var(--cream);
      border-bottom: 1px solid var(--stone);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }

    .nav-brand {
      font-family: var(--font-serif);
      font-size: 1.6rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: var(--ink);
    }

    .nav-links { display: flex; gap: 2rem; }

    .nav-links a {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--ash);
      letter-spacing: 0.03em;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: var(--teal); }

    /* ── Main ────────────────────────────────────────────────────── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
    }

    .card {
      background: #fff;
      border: 1px solid var(--stone);
      border-radius: 8px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 400;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 0.875rem;
      color: var(--ash);
      margin-bottom: 2rem;
    }

    label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 500;
      margin-bottom: 0.375rem;
      letter-spacing: 0.02em;
    }

    input[type="password"] {
      width: 100%;
      padding: 0.625rem 0.875rem;
      border: 1px solid var(--stone);
      border-radius: 4px;
      font-family: var(--font-sans);
      font-size: 0.9375rem;
      color: var(--ink);
      background: var(--cream);
      transition: border-color 0.2s, box-shadow 0.2s;
      margin-bottom: 1.25rem;
    }

    input[type="password"]:focus {
      outline: none;
      border-color: var(--teal);
      box-shadow: 0 0 0 3px var(--teal-lt);
    }

    button[type="submit"] {
      width: 100%;
      padding: 0.75rem;
      background: var(--teal);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-family: var(--font-sans);
      font-size: 0.9375rem;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: background 0.2s;
    }

    button[type="submit"]:hover:not(:disabled) { background: #1f5f56; }
    button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }

    .message {
      margin-top: 1.25rem;
      padding: 0.75rem 1rem;
      border-radius: 4px;
      font-size: 0.875rem;
      display: none;
    }

    .message.success {
      background: var(--teal-lt);
      color: var(--teal);
      border: 1px solid #a8d5d0;
      display: block;
    }

    .message.error {
      background: #fce8e3;
      color: var(--coral);
      border: 1px solid #f0c4b8;
      display: block;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: var(--ash);
    }

    .back-link a { color: var(--teal); font-weight: 500; }
    .back-link a:hover { text-decoration: underline; }

    .invalid-state {
      text-align: center;
      padding: 1.5rem 0;
    }

    .invalid-state p {
      color: var(--ash);
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="nav-brand">Wander</a>
    <div class="nav-links">
      <a href="/destinations.html">Destinations</a>
      <a href="/about.html">About</a>
      <a href="/contact.html">Contact</a>
    </div>
  </nav>

  <main>
    <div class="card">
      <div id="invalid-state" class="invalid-state" hidden>
        <h1>Invalid link</h1>
        <p>This password-reset link is missing required parameters.</p>
        <p><a href="/forgot-password.html" style="color: var(--teal); font-weight: 500;">Request a new reset link</a></p>
      </div>

      <div id="form-wrapper">
        <h1>Reset password</h1>
        <p class="subtitle">Choose a new password for your account.</p>

        <form id="reset-form" novalidate>
          <label for="password">New password</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="new-password"
            placeholder="At least 8 characters"
            required
            minlength="8"
          />

          <label for="confirm-password">Confirm new password</label>
          <input
            type="password"
            id="confirm-password"
            name="confirmPassword"
            autocomplete="new-password"
            placeholder="Repeat your new password"
            required
          />

          <button type="submit" id="submit-btn">Reset password</button>
        </form>

        <div class="message" id="message" role="alert" aria-live="polite"></div>

        <p class="back-link" id="back-link">
          <a href="/forgot-password.html">Request a new link</a>
        </p>
      </div>
    </div>
  </main>

  <script>
    // Read token and email from URL query params.
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const email = params.get('email');

    const formWrapper = document.getElementById('form-wrapper');
    const invalidState = document.getElementById('invalid-state');
    const form = document.getElementById('reset-form');
    const submitBtn = document.getElementById('submit-btn');
    const messageEl = document.getElementById('message');
    const backLink = document.getElementById('back-link');

    if (!token || !email) {
      formWrapper.hidden = true;
      invalidState.hidden = false;
    }

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = 'message ' + type;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (!password) {
        showMessage('Please enter a new password.', 'error');
        return;
      }

      if (password.length < 8) {
        showMessage('Password must be at least 8 characters.', 'error');
        return;
      }

      if (password !== confirmPassword) {
        showMessage('Passwords do not match.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Resetting…';
      messageEl.className = 'message'; // hide previous

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, token, password }),
        });

        const data = await res.json();

        if (res.ok) {
          // Store access token for immediate use.
          if (data.accessToken) {
            sessionStorage.setItem('accessToken', data.accessToken);
          }
          showMessage(
            'Password reset successfully! Redirecting you to the home page…',
            'success',
          );
          form.hidden = true;
          backLink.hidden = true;
          setTimeout(() => { window.location.href = '/'; }, 2500);
        } else {
          showMessage(
            data.error || 'Reset failed. Please request a new reset link.',
            'error',
          );
        }
      } catch {
        showMessage('Network error. Please check your connection and try again.', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Reset password';
      }
    });
  </script>
</body>
</html>
